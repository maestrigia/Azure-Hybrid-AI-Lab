name: Build and deploy Azure Local Health Analyzer

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ai/health-analyzer/requirements.txt
          pip install -r ai/health-analyzer/requirements-dev.txt

      - name: Run sanitizer regression tests
        run: |
          python -m pytest ai/health-analyzer/test_sanitizer.py -v

      - name: Validate Python application
        run: |
          python -m py_compile ai/health-analyzer/app.py
          python -m py_compile ai/health-analyzer/analyze_health.py
          python -m py_compile ai/health-analyzer/sanitizer.py

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: ai/health-analyzer/

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download application artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_CC0B5BACBFDE40CB8F08AD2CFBE99E31 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_DBF77BCEB76F4314B4938A54760AB31B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_99004E4530694049854A9BD0B22A47E6 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'azure-local-health-analyzer'
          slot-name: 'Production'
          package: .
